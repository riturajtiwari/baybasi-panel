; Build only the classic-ESP32 bench env unless another is named explicitly.
; Without this, a bare "pio run" also builds panel-test-s3 and drags down a
; ~100 MB xtensa-esp32s3 toolchain you do not need until the S3 boards arrive.
; Use the S3 one deliberately:  pio run -e panel-test-s3 -t upload
[platformio]
default_envs = panel-test

; Baybasi bench panel test — CLASSIC ESP32, not the production target.
;
; The real controller firmware is in ../fw and targets the ESP32-S3 with
; Ethernet. This project exists only to prove panels light on the bench, and it
; deliberately shares nothing with that one: different chip, different pins, no
; network.
;
; The stock espressif32 platform (arduino-esp32 core 2.x) is used here on
; purpose. ../fw needs the pioarduino fork for core 3.x because of the W5500;
; nothing in this test does, and core 2.x is the better-trodden path for
; FastLED's RMT driver on the classic ESP32.

[env:panel-test]
build_src_filter = +<*> -<all12.cpp> -<liveness.cpp>
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -O2
    ; How many panels are chained on the one wire. Set it HERE rather than via
    ; PLATFORMIO_BUILD_FLAGS: an env var also perturbs the bootloader rebuild and
    ; silently persists for every later build in the same shell.
    ;   1 = a single panel    4 = one row    12 = a whole column
    -DPANELS=1
    ; Uncomment ONE of these if the panels turn out not to be WS2812B.
    ; Wrong chipset looks identical to a dead panel.
    ; -DLED_CHIPSET=WS2811
    ; -DLED_CHIPSET=WS2812
    ; -DLED_CHIPSET=SK6812

lib_deps =
    ; Pinned exactly, not a caret range. "^3.7.0" resolved to 3.10.3 and worked,
    ; but a range means a future FastLED release can change this build without
    ; anything in the repo changing. 3.10.3 is the version proven on this bench.
    fastled/FastLED@3.10.3

upload_protocol = esptool

; The CH340C on this board is marginal at PlatformIO's default 460800 and throws
; intermittent "MD5 of file does not match data in flash" on the first block.
; 115200 turns a ~5 s upload into ~25 s and makes it deterministic. Raise it only
; if you get bored, and put it back the moment a verify fails.
upload_speed = 115200

; Flash reliability fallbacks, added 2026-09-13 after repeated
; "MD5 of file does not match data in flash" at 0x1000 on this board.
; DIO uses two data lines instead of four and 26 MHz is the slowest the ESP32
; supports, so a marginal flash chip or a tired solder joint gets its best
; chance. Both cost boot time and nothing else; revert once a good board works.
; arduino-esp32 only ships prebuilt bootloaders for dio/dout/qio/qout at 40 and
; 80 MHz, so 26 MHz is not selectable: it fails with "bootloader_dio_26m.elf not
; found". DOUT at 40 MHz is the gentlest combination that actually exists —
; single line for command and address, dual only for data.
board_build.flash_mode = dout
board_build.f_flash    = 40000000L

; This board's flash is ZBIT (JEDEC 0x5E, device 0x4016), a budget part that
; does not implement every command the way esptool's stub flasher expects.
; --no-stub falls back to the ESP32 ROM's own flash routines: slower, but it is
; the documented fix for ZBIT parts that erase in "0.0 seconds" and then fail
; the MD5 verify. Drop this line if you move to a board with Winbond flash.
upload_flags =
    --no-stub


; ---------------------------------------------------------------------------
; The same bench test on an ESP32-S3-DevKitC-1, the board the real controllers
; use. Added 2026-09-13 after the classic ESP32's ZBIT flash failed for good.
; Ordering S3 devkits covers both jobs: bench testing now, production later.
;
;   pio run -e panel-test-s3 -t upload
;
; GPIO 4 is deliberate: it is D1 on the production controller, so whatever you
; learn about a panel here applies to the first output of the real board.
[env:panel-test-s3]
build_src_filter = +<*> -<all12.cpp> -<liveness.cpp>
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -O2
    -DARDUINO_USB_CDC_ON_BOOT=1    ; serial over the devkit's native USB port
    -DLED_PIN=4
    -DSTATUS_LED=48                ; the S3 devkit's LED is an addressable RGB
    -DPANELS=1

lib_deps =
    fastled/FastLED@3.10.3

upload_protocol = esptool


; ---------------------------------------------------------------------------
; Bring-up of the BAYBASI COLUMN CTRL board itself, with the devkit on flying
; leads rather than in its sockets. Added 2026-09-15: the devkit in hand has a
; wider header pitch than A1L/A1R, and forcing it would wreck the sockets on a
; good board.
;
;   pio run -e ctrl-board -t upload
;
; Three jumpers, all on the LEFT socket (A1L), counting holes from the TOP of
; the board (the J1-J6 end):
;
;   devkit GND  ->  A1L hole 22   (the last one)
;   devkit  8   ->  A1L hole 12   -> /OE, must be LOW or nothing comes out
;   devkit  4   ->  A1L hole  4   -> output D1 -> R1 (330R) -> J1
;
; Check the count before you trust it: A1L hole 22 is a dead short to the J13
; GND terminal, and hole 21 shows a diode drop to J13 '+' through Q1. If those
; two do not read that way, you are counting from the wrong end.
;
; Board 5 V comes from J13 and the devkit's from USB. Do NOT also jumper 5 V:
; the devkit's 5 V pin back-feeds this board through Q1's channel (FABRICATION.md).
; The GND jumper is not optional - it is the only thing referencing the logic.
;
; Panel 5 V and GND come from the bench supply, never from this board. J1-J12
; carry DATA + GND only.
[env:ctrl-board]
build_src_filter = +<*> -<all12.cpp> -<liveness.cpp>
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -O2
    -DARDUINO_USB_CDC_ON_BOOT=1    ; serial on the devkit's native USB port
    -DLED_PIN=4                   ; -> A1L hole 4 -> D1 -> J1
    -DOE_PIN=8                     ; -> A1L hole 12; LOW enables both 245s
    -DSTATUS_LED=48
    -DPANELS=1

lib_deps =
    fastled/FastLED@3.10.3

upload_protocol = esptool


; ---------------------------------------------------------------------------
; All twelve outputs at once, for controller board bring-up. Flash ONCE, then
; move a single panel from J1 to J12: every output runs the same walking trail
; in its own colour, with N white pixels marking which output you are on.
;
;   pio run -e ctrl-all12 -t upload
;
; Needs both rows of the devkit reachable. With the devkit half-seated in A1L
; only, D1-D3 work and D4-D12 do nothing; put the devkit in a breadboard and
; run male-to-male jumpers into A1L/A1R to reach all twelve.
;
; Overrides:  -DBRIGHTNESS=n  -DWALK_MS=n
[env:ctrl-all12]
build_src_filter = +<all12.cpp>
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -O2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DOE_PIN=8

lib_deps =
    fastled/FastLED@3.10.3

upload_protocol = esptool


; ---------------------------------------------------------------------------
; Single-panel liveness check for a BUILT wall. No controller PCB, no bench
; supply: the devkit powers one panel from its own 5 V pin and drives DIN
; directly, so the whole rig is a USB cable and a 3-pin lead.
;
;   pio run -e panel-liveness -t upload
;
;   devkit 14    -> panel DIN  (green)
;   devkit 5Vin  -> panel +5 V (red)
;   devkit GND   -> panel GND  (white)    <- FIRST on, LAST off
;
; Those three are contiguous at the bottom of the left header, in the order
; DATA / 5V / GND, so a 3-pin lead reaches all of them. A standard WS2812 lead
; is +5V / DATA / GND with data in the MIDDLE, so THE TEST LEAD IS DELIBERATELY
; RE-ORDERED to come out correct at the panel end.
;
; LABEL THAT LEAD. It is wired differently from every other JST-SM lead in this
; project (FABRICATION.md: white GND, green DATA, red +5 V cut and capped). Mix
; it into the panel leads and it will put +5 V onto a data line.
;
; CHECK 5Vin BEFORE TRUSTING IT. On most devkits that pin sits on USB VBUS
; behind a Schottky, so it reads ~4.6-5.0 V with USB plugged in and can source
; the panel. Some boards wire it as an INPUT only, isolated from VBUS, and it
; reads 0 V. Meter it first: 0 V means the panel needs its own 5 V source and
; this whole approach changes.
;
; POWER. 256 WS2812Bs idle at ~150-260 mA before anything lights, so the
; pattern never floods the panel in white. Budget is MAX_MA of drive plus
; ~260 mA quiescent plus ~80 mA devkit. Use a charger or powered hub; an old
; 500 mA USB-A port will brown out and reset the devkit mid-sweep, which looks
; exactly like a dead panel.
;
; SIGNAL. Driving DIN straight from a 3.3 V GPIO is out of spec: the WS2812B
; wants 0.7 x VDD = 3.5 V. It usually works, and it works BETTER here than it
; would from a bench supply, because the devkit's 5 V pin sags to ~4.6-4.8 V
; after its USB diode and that drops the threshold with it. But it is marginal
; by design, so a panel that fails this test is SUSPECT, not dead - re-test it
; through the controller board, which has a proper 5 V level shifter, before
; throwing it away.
[env:panel-liveness]
build_src_filter = +<liveness.cpp>
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -O2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLED_PIN=14            ; contiguous with 5Vin and GND; see the note above
    -DPANEL_LEDS=256
    ; Sized for an external 5 V source on 5Vin (a USB power bank), NOT a
    ; 500 mA USB port. Measured on this devkit 2026-09-20: 5Vin reads 0.18 V
    ; with USB-C connected, so it is an INPUT, isolated from VBUS - the panel
    ; cannot be powered from it unless something else drives it.
    ; Worst case here is ~700 mA drive + ~260 mA panel quiescent + ~80 mA
    ; devkit = ~1.04 A. If the bank cuts out, halve MAX_MA and FLOOD_LEVEL.
    -DMAX_MA=700            ; FastLED drive cap, a hard backstop
    -DSWEEP_LEVEL=96        ; only a few LEDs lit at once
    -DFLOOD_LEVEL=20        ; ALL 256 lit, one channel: ~400 mA

lib_deps =
    fastled/FastLED@3.10.3

upload_protocol = esptool


; ---------------------------------------------------------------------------
; Panel liveness THROUGH the controller board. Devkit half-seated in A1L, so
; D1-D3 (J1/J2/J3) are reachable; panel 5 V comes from the supply, separately,
; as it does in service.
;
;   pio run -e panel-liveness-ctrl -t upload
;
; This is the better test of the two. The bare-devkit build drives DIN from a
; 3.3 V GPIO, which is under the WS2812B's 0.7*VDD threshold and can fail a
; good panel. Here the signal goes through the SN74AHCT245s and arrives at a
; proper 5 V, so a panel that fails this one has really failed - no re-test
; needed before you set it aside.
;
; All three outputs carry the SAME pattern from one buffer: use whichever
; jumper is convenient, or hang three panels on J1/J2/J3 and check three at a
; time.
;
; No USB current ceiling here, so the levels are up: flood is ~1 A per panel
; on one channel, and MAX_MA covers three panels at once.
[env:panel-liveness-ctrl]
build_src_filter = +<liveness.cpp>
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -O2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCTRL_OUTPUTS             ; D1/D2/D3 instead of one bare GPIO
    -DOE_PIN=8                 ; without this the 245s stay high-Z: nothing out
    -DPANEL_LEDS=256
    -DMAX_MA=3000              ; panel power is the supply's, not USB's
    -DSWEEP_LEVEL=128
    -DFLOOD_LEVEL=48           ; ALL 256 on one channel: ~1 A per panel

lib_deps =
    fastled/FastLED@3.10.3

upload_protocol = esptool
