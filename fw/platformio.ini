; Baybasi controller firmware.
;
; ETH.begin(ETH_PHY_W5500, ...) needs arduino-esp32 core 3.x, which the official
; PlatformIO espressif32 platform does not ship (it is still on core 2.x).  The
; pioarduino fork does.  If this URL 404s, take the newest 5x.x release from
;   https://github.com/pioarduino/platform-espressif32/releases
; and change the version here; nothing else in this file depends on it.

[env:baybasi-ctrl]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Two app slots, so an OTA has somewhere to land.  The DevKitC-1 N16R8 wants
; default_16MB.csv instead.
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1      ; serial over the devkit's native USB
    -DBOARD_HAS_PSRAM
    -O2

lib_deps =
    ; Twelve parallel WS2812B outputs.  The ESP32-S3 has only four RMT transmit
    ; channels, so this uses the LCD_CAM peripheral in parallel mode.  Any GPIO
    ; works because it routes through the GPIO matrix.
    https://github.com/hpwit/I2SClocklessLedDriver.git
    ESP32Async/AsyncUDP

; Bench flashing, over the devkit's USB-C, before the board is seated.
; See fw/README.md: a devkit seated in a powered board with USB live will
; back-feed 5 V into the panel column.
upload_protocol = esptool
