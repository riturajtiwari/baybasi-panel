; Baybasi controller firmware.
;
; ETH.begin(ETH_PHY_W5500, ...) needs arduino-esp32 core 3.x, which the official
; PlatformIO espressif32 platform does not ship (it is still on core 2.x).  The
; pioarduino fork does.  If this URL 404s, take the newest 5x.x release from
;   https://github.com/pioarduino/platform-espressif32/releases
; and change the version here; nothing else in this file depends on it.
;
; 54.03.21-2 = Arduino 3.2.1 on ESP-IDF 5.4.2. This is a WINDOW, not a floor.
; Do not "upgrade" without testing the LED output on hardware.
;
;   below 5.4  - the S3 I2S LED driver will not COMPILE. It sets
;                gdma_channel_alloc_config_t.flags.isr_cache_safe, a field that
;                does not exist until 5.4. (53.03.13 / IDF 5.3.2 failed here.)
;   5.5.x      - it compiles and boots but the LCD bus will not open:
;                  esp_lcd_new_i80_bus(166): register back up is not supported
;                  FASTLED ASSERT FAILED: Failed to create ESP32 I2S LCD bus
;                then LoadProhibited. 5.5 added a sleep-retention field to the
;                i80 bus config that the driver does not set. (55.03.312.)
;   5.4.x      - what FastLED itself names. Its own version guards in
;                platforms/esp/32/clockless_i2s_esp32s3.h say "upgrade to
;                ESP-IDF 5.4.0 in Arduino core esp32 3.2.0+".

[env:baybasi-ctrl]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Two app slots, so an OTA has somewhere to land.  The DevKitC-1 N16R8 wants
; default_16MB.csv instead.
board_build.flash_mode = qio
; flash QIO + psram OPI. Required for the N16R8's octal PSRAM; see the
; -DBOARD_HAS_PSRAM note in build_flags for what happens without it.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    ; I2SClocklessLedDriver.h calls memset() without including <cstring>. The
    ; older GCC 8 in the stock platform pulled it in transitively; GCC 13 here
    ; does not, so the library will not compile. Force-including it fixes every
    ; translation unit and, unlike editing .pio/libdeps, survives a clean and a
    ; library reinstall. Upstream bug, not ours.
    ;
    ; string.h, NOT cstring: this flag reaches the framework's .c files too, and
    ; <cstring> is C++-only. With it you get
    ;   <command-line>: fatal error: cstring: No such file or directory
    ; building FrameworkArduino/ColorFormat.c. <string.h> is valid in both and
    ; declares memset in the global namespace, which is how the library calls it.
    -include string.h
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1      ; serial over the devkit's native USB
    ; Selects FastLED's ESP32-S3 LCD_CAM parallel driver: makes
    ; WS2812Controller800Khz resolve to ClocklessController_I2S_Esp32_WS2812,
    ; so all twelve outputs clock out simultaneously rather than queueing on
    ; the four RMT channels. Without it, twelve strands cost twelve strand
    ; times and 30 fps is out of reach.
    -DFASTLED_USES_ESP32S3_I2S
    ; -DFASTLED_ESP32_I2S_NUM_DMA_BUFFERS=4 is FastLED's suggestion for reducing
    ; flicker when other ISRs are busy. Left at the default 2 for now; add it
    ; only if flicker actually shows up with the W5500 and AsyncUDP running.
    ; PSRAM IS REQUIRED, and it must be OCTAL.
    ;
    ; FastLED's S3 I2S driver allocates its two transpose buffers with
    ;   heap_caps_aligned_alloc(..., MALLOC_CAP_SPIRAM | MALLOC_CAP_8BIT)
    ; - 8 * 3 * 256 * 3 * 2 + 578 = 37442 bytes each - and memsets the result
    ; without a NULL check. With PSRAM off it panics: StoreProhibited at
    ; EXCVADDR 0x00000000, with A4 = 0x9242 = exactly 37442.
    ;
    ; But plain -DBOARD_HAS_PSRAM is not enough either: the esp32-s3-devkitc-1
    ; board definition assumes QUAD psram and these are N16R8 (OCTAL), which
    ; boot-loops with
    ;   E quad_psram: PSRAM chip is not connected, or wrong PSRAM line mode
    ; followed by Guru Meditation. board_build.arduino.memory_type = qio_opi
    ; below is what selects flash QIO + psram OPI and makes both work.
    ;
    ; Octal PSRAM reserves GPIO 35, 36, 37. This design routes around all
    ; three - see the pin map in hw/FABRICATION.md - so nothing is lost.
    -DBOARD_HAS_PSRAM
    -O2

lib_deps =
    ; Twelve parallel WS2812B outputs through the LCD_CAM peripheral, because
    ; the ESP32-S3 has only four RMT transmit channels. Any GPIO works - it all
    ; routes through the GPIO matrix.
    ;
    ; This was hpwit/I2SClocklessLedDriver until 2026-09-19. That library
    ; compiles on IDF 5.5 but does not work: ~1 s per frame instead of 7.68 ms.
    ; FastLED wraps the same class of driver and version-guards the IDF
    ; releases it is broken on, which is the difference that matters.
    ;
    ; Pinned exactly, not a caret range: "^3.7.0" silently resolved to 3.10.3
    ; in fw-bench. 3.10.3 is the version proven on this hardware.
    fastled/FastLED@3.10.3

; AsyncUDP is NOT listed here. It ships inside the arduino-esp32 core, at
; framework-arduinoespressif32/libraries/AsyncUDP, and the LDF finds it from
; the #include alone. Listing it sends PlatformIO to the registry instead,
; where there is no such package:
;   UnknownPackageError: Could not find the package with 'ESP32Async/AsyncUDP'
; Found on the first ever build of this project, 2026-09-19.

; Bench flashing, over the devkit's USB-C, before the board is seated.
; See fw/README.md: a devkit seated in a powered board with USB live will
; back-feed 5 V into the panel column.
upload_protocol = esptool
